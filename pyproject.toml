[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressb"
version = "0.1.0"
description = "Modular robot policy inference, supervised training and online RL with simulated or physical environments"
# The Isaac Sim environment pins packaging 23, which predates SPDX expression parsing.
license = {text = "MIT"}
requires-python = ">=3.10,<3.12"
dependencies = ["numpy<2", "scipy", "Pillow", "matplotlib", "PyYAML"]

[project.scripts]
pressb = "pressb.experiments.cli:main"
pressb-model-train = "pressb.training.cli:main"
pressb-robot-operator = "pressb.runtime.real_robot_operator:main"

[project.optional-dependencies]
online-rl = ["torch>=2.6", "threadpoolctl>=3", "websockets>=12,<16", "msgpack>=1,<2"]
inference-server = ["websockets>=14,<16", "msgpack>=1,<2"]
real-robot = ["piper_sdk", "pyrealsense2", "websockets>=14,<16", "msgpack>=1,<2"]
franka-real = ["pyrealsense2", "websockets>=14,<16", "msgpack>=1,<2"]
pap = ["av", "pyarrow", "websockets>=12,<16", "msgpack>=1,<2"]
diffusion-policy = ["torch>=2.6", "torchvision", "einops", "pyarrow", "av"]
table-buttons = ["pin==2.7.0", "hpp-fcl==2.4.4"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pressb*"]

[tool.setuptools.package-data]
"pressb.model_sources" = ["**/*.py", "**/*.json", "**/*.yaml", "**/*.yml", "**/*.toml", "**/*.txt", "**/*.md", "**/*.cu", "**/*.cuh", "**/*.h", "**/*.sh", "**/LICENSE*"]
"pressb.robots.franka" = ["native/*.cpp", "native/*.hpp", "native/CMakeLists.txt", "native/LICENSE*", "native/NOTICE*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
